<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; manifest-src 'self'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>IronmanCoach</title>
  <meta name="description" content="Séances du jour et planning d'entraînement IronmanCoach.">
  <meta name="theme-color" content="#0b1520">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="28" height="28">
      <span>IronmanCoach</span>
    </div>
    <div class="topbar-actions">
      <button id="btn-refresh" class="icon-btn" type="button" aria-label="Actualiser" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
      <button id="btn-account" class="icon-btn" type="button" aria-label="Compte" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <main id="app" tabindex="-1">
    <p class="loading">Chargement…</p>
  </main>

  <nav id="tabs" class="tabs" hidden>
    <button type="button" data-view="today" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Aujourd'hui</span>
    </button>
    <button type="button" data-view="planning" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Planning</span>
    </button>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>

  <noscript>IronmanCoach nécessite JavaScript.</noscript>
  <script src="config.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
